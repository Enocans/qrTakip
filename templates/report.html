<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LGS Rapor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 24px;
            color: #0f172a;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 20px;
        }
        h1 {
            margin-top: 0;
        }
        .actions {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .actions a {
            text-decoration: none;
            background: #0f172a;
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            overflow: auto;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background: #eff6ff;
        }
        tr:nth-child(even) {
            background: #f8fafc;
        }
        .empty {
            padding: 30px;
            text-align: center;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LGS Gelişim Raporu</h1>
        <div class="actions">
            <a href="{{ url_for('index') }}">Form Sayfası</a>
            <a href="{{ url_for('download_excel') }}">Excel İndir</a>
        </div>

        {% if data_rows %}
        <table>
            <thead>
                <tr>
                    {% for header in headers %}
                    <th>{{ header }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in data_rows %}
                <tr>
                    {% for value in row %}
                    <td>{{ value }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty">Henüz kayıt yok. Formdan ilk veriyi ekleyin.</div>
        {% endif %}
    </div>
</body>
</html>
