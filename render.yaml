services:
  - type: web
    name: qr-takip
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: 1
      - key: PUBLIC_URL
        sync: false
    disk:
      name: pusula-data
      mountPath: /var/data
      sizeGB: 1
